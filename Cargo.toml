[package]
name = "argus"
version = "1.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
memmap2 = "0.9"
memchr = "2.7"
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }
clap = { version = "4.4", features = ["derive"] }
tempfile = { version = "3.10", optional = true }
aho-corasick = "1.1"
base64 = "0.21"
ignore = "0.4.25"
rayon = "1.11.0"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = { version = "0.10", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
syntect = { version = "5.2", optional = true }

[features]
default = ["native"]
native = ["tempfile", "env_logger", "ratatui", "crossterm"]
js-ast = ["tree-sitter", "tree-sitter-javascript"]
py-ast = ["tree-sitter", "tree-sitter-python"]
go-ast = ["tree-sitter", "tree-sitter-go"]
rust-ast = ["tree-sitter", "tree-sitter-rust"]
java-ast = ["tree-sitter", "tree-sitter-java"]
highlighting = ["syntect"]

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
io-uring = "0.7"

[[bin]]
name = "argus"
path = "src/main.rs"
required-features = ["native"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 0
strip = true
panic = "unwind"
incremental = true
lto = false
codegen-units = 256
